
<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Świąteczny Los K&amp;K 🎄</title>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:url('https://i.ibb.co/tBf5G6/christmas-bg.jpg') no-repeat center center fixed;background-size:cover;display:flex;justify-content:center;align-items:center;padding:20px}
.container{width:100%;max-width:600px;background:rgba(255,255,255,.94);padding:30px;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.25);text-align:center}
h1{margin-top:0;color:#b30000;cursor:pointer}
h2{color:#333}
p{color:#555}
input{width:100%;padding:14px;margin-top:10px;margin-bottom:20px;border:2px solid #ddd;border-radius:10px;font-size:16px}
input:focus{outline:none;border-color:#b30000}
.groups{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}
.group-button{padding:18px 5px;border:none;border-radius:12px;background:#b30000;color:white;font-size:20px;font-weight:bold;cursor:pointer;transition:.2s}
.group-button:hover:not(:disabled){transform:scale(1.05);background:#8f0000}
.group-button:disabled{background:#aaa;color:#eee;cursor:not-allowed;opacity:.7;transform:none}
#result{margin-top:25px;padding:20px;border-radius:15px;background:#f5f5f5;font-size:18px;font-weight:bold;line-height:1.5}
#available{margin-top:20px;padding:12px;border-radius:10px;background:rgba(255,255,255,.8);color:#333;font-size:15px}
.available-names{color:#b30000;font-weight:bold}
#adminPanel{display:none;margin-top:30px;padding:20px;background:#f0f0f0;border-radius:15px}
#adminLogin{display:none;margin-top:20px;padding:20px;background:white;border-radius:12px}
#adminLogs{margin-top:20px;text-align:left;max-height:500px;overflow-y:auto}
.log{padding:14px;margin-bottom:10px;background:white;border-radius:10px;font-size:14px;line-height:1.5}
.log strong{color:#b30000}
.admin-button{padding:12px 20px;margin:5px;border:none;border-radius:8px;background:#333;color:white;cursor:pointer}
.admin-button:hover{background:#111}
#qrCode{margin-top:25px;display:flex;justify-content:center}
.warning{color:#b30000;font-weight:bold}
.success{color:#168a2f;font-weight:bold}
.winner{margin-top:10px;font-size:24px;color:#b30000}
@media(max-width:500px){
.container{padding:20px}
.groups{gap:5px}
.group-button{padding:15px 3px;font-size:17px}
}
</style>
</head>

<body>
<div class="container">
<h1 id="title">🎄 Świąteczny Los K&amp;K 🎁</h1>
<p>Wpisz swoje imię, a następnie wybierz jedną z dostępnych grup.</p>

<input type="text" id="nameInput" placeholder="Wpisz swoje imię..." autocomplete="off">

<div id="available">Sprawdzanie dostępności...</div>

<h2>Wybierz grupę</h2>
<p>Wybierz A, B, C lub D.</p>

<div class="groups">
<button class="group-button" data-group="1">A</button>
<button class="group-button" data-group="2">B</button>
<button class="group-button" data-group="3">C</button>
<button class="group-button" data-group="4">D</button>
</div>

<div id="result"></div>
<div id="qrCode"></div>

<div id="adminPanel">
<h2>🔐 Panel administratora</h2>

<div id="adminLogin">
<p>Zaloguj się jako administrator.</p>
<input type="email" id="adminEmail" placeholder="E-mail administratora" autocomplete="username">
<input type="password" id="adminPassword" placeholder="Hasło" autocomplete="current-password">
<button class="admin-button" id="adminLoginButton">Zaloguj administratora</button>
<div id="adminLoginResult"></div>
</div>

<div id="adminControls" style="display:none;">
<p>✅ Zalogowano jako administrator.</p>
<button class="admin-button" id="loadLogs">Pokaż wyniki</button>
<button class="admin-button" id="resetData">Resetuj losowanie K&amp;K 2026</button>
<button class="admin-button" id="adminLogout">Wyloguj administratora</button>
<div id="adminLogs"></div>
</div>
</div>
</div>

<script>
const firebaseConfig={
apiKey:"AIzaSyD6z8n6KYGWUclXdoS85aj7T_U5HKyGKZA",
authDomain:"swiateczny-los-kk.firebaseapp.com",
projectId:"swiateczny-los-kk",
storageBucket:"swiateczny-los-kk.firebasestorage.app",
messagingSenderId:"880321205108",
appId:"1:880321205108:web:9b7eec39d5999ed5cc9221"
};

firebase.initializeApp(firebaseConfig);

const db=firebase.firestore();
const auth=firebase.auth();
const CURRENT_YEAR=2026;
const ADMIN_UID="NnhwCPIk6yOveCvr5QPb1yTiJjw1";

const groups={
1:["Kasia", "Kamil"],
2:["Nikola", "Kornel"],
3:["Iwona","Sebastian"],
4:["Kinga", "Dawid"]
};

const users=["Nikola","Iwona","Kinga","Kasia"];

const userGroups={
"Iwona":3,
"Kinga":4,
"Kasia":1,
"Nikola":2
};

const nameInput=document.getElementById("nameInput");
const availableDiv=document.getElementById("available");
const resultDiv=document.getElementById("result");
const qrCodeDiv=document.getElementById("qrCode");
const adminPanel=document.getElementById("adminPanel");
const adminLogs=document.getElementById("adminLogs");
const groupButtons=document.querySelectorAll(".group-button");
const adminLogin=document.getElementById("adminLogin");
const adminControls=document.getElementById("adminControls");
const adminEmail=document.getElementById("adminEmail");
const adminPassword=document.getElementById("adminPassword");
const adminLoginResult=document.getElementById("adminLoginResult");

function groupLetter(groupNumber){
return String.fromCharCode(64+Number(groupNumber));
}

function escapeHtml(value){
const div=document.createElement("div");
div.textContent=String(value);
return div.innerHTML;
}

function isAdmin(){
const user=auth.currentUser;
return !!user&&!user.isAnonymous&&user.uid===ADMIN_UID;
}

/*
POPRAWIONE SPRAWDZANIE PRZYPISAŃ

Sprawdza, czy wszystkie pozostałe osoby mogą otrzymać
różne grupy, bez otrzymania własnej grupy.

Zwraca false, jeśli liczba osób i grup się nie zgadza
lub nie istnieje żadne prawidłowe przypisanie.
*/
function canCompleteAssignment(remainingUsers,availableGroups){
if(remainingUsers.length!==availableGroups.length){
return false;
}

if(remainingUsers.length===0){
return true;
}

const candidates=remainingUsers.map(user=>({
user,
options:availableGroups.filter(group=>userGroups[user]!==group)
})).sort((a,b)=>a.options.length-b.options.length);

if(candidates.some(person=>person.options.length===0)){
return false;
}

function assignNext(index,unusedGroups){
if(index===candidates.length){
return true;
}

const person=candidates[index];

for(const group of person.options){
if(!unusedGroups.has(group)){
continue;
}

const nextUnused=new Set(unusedGroups);
nextUnused.delete(group);

if(assignNext(index+1,nextUnused)){
return true;
}
}

return false;
}

return assignNext(0,new Set(availableGroups));
}

async function updateAvailableUsers(){
try{
const snapshot=await db.collection("drawsKK")
.where("year","==",CURRENT_YEAR).get();

const drawnUsers=snapshot.docs.map(doc=>doc.data().user);
const availableUsers=users.filter(user=>!drawnUsers.includes(user));

if(availableUsers.length){
availableDiv.innerHTML="Dostępni do losowania: "+
'<strong class="available-names">'+
escapeHtml(availableUsers.join(", "))+"</strong>";
}else{
availableDiv.textContent="🎉 Wszyscy już dokonali losowania!";
}
}catch(error){
console.error(error);
availableDiv.textContent="⚠️ Problem z połączeniem z bazą danych.";
}
}

async function updateGroupButtons(){
try{
const [drawsSnapshot,locksSnapshot]=await Promise.all([
db.collection("drawsKK").where("year","==",CURRENT_YEAR).get(),
db.collection("groupLocksKK").where("year","==",CURRENT_YEAR).get()
]);

// Uwzględnij zarówno blokady, jak i grupy zapisane w losowaniach.
const takenGroups=new Set();

locksSnapshot.docs.forEach(doc=>{
const group=Number(doc.data().group);
if(Number.isInteger(group))takenGroups.add(group);
});

drawsSnapshot.docs.forEach(doc=>{
const group=Number(doc.data().group);
if(Number.isInteger(group))takenGroups.add(group);
});

groupButtons.forEach(button=>{
const group=Number(button.dataset.group);
const taken=takenGroups.has(group);

button.disabled=taken;
button.title=taken
?"Ta grupa została już wykorzystana."
:"";
});
}catch(error){
console.error("Błąd aktualizacji grup:",error);
}
}

async function updateEverything(){
await Promise.all([
updateGroupButtons(),
updateAvailableUsers()
]);
}

nameInput.addEventListener("input",function(){
resultDiv.innerHTML="";
qrCodeDiv.innerHTML="";
updateGroupButtons();
});

groupButtons.forEach(button=>{
button.addEventListener("click",async function(){
const selectedName=nameInput.value.trim();
const selectedGroup=Number(this.dataset.group);

if(!selectedName){
resultDiv.innerHTML='<span class="warning">Najpierw wpisz swoje imię.</span>';
return;
}

if(!users.includes(selectedName)){
resultDiv.innerHTML='<span class="warning">Nie znaleziono tego imienia.</span>';
return;
}

if(!Number.isInteger(selectedGroup)||!groups[selectedGroup]){
resultDiv.innerHTML='<span class="warning">Nieprawidłowa grupa.</span>';
return;
}

resultDiv.textContent="⏳ Sprawdzanie możliwości losowania...";

try{
await db.runTransaction(async transaction=>{

/*
WAŻNE:
Wszystkie odczyty wykonujemy przed pierwszym zapisem.
Firestore może ponowić transakcję, jeśli inny użytkownik
zmieni dokumenty w czasie losowania.
*/

const drawRefs={};
const drawSnapshots={};

for(const user of users){
drawRefs[user]=db.collection("drawsKK")
.doc(CURRENT_YEAR+"_"+user);
}

const lockRefs={};
const lockSnapshots={};

for(const group of Object.keys(groups).map(Number)){
lockRefs[group]=db.collection("groupLocksKK")
.doc(CURRENT_YEAR+"_"+group);
}

for(const user of users){
drawSnapshots[user]=await transaction.get(drawRefs[user]);
}

for(const group of Object.keys(groups).map(Number)){
lockSnapshots[group]=await transaction.get(lockRefs[group]);
}

// 1. Uczestnik może losować tylko raz.
if(drawSnapshots[selectedName].exists){
throw new Error("ALREADY_DRAWN");
}

// 2. Nie wolno wylosować własnej grupy.
if(userGroups[selectedName]===selectedGroup){
throw new Error("OWN_GROUP");
}

// 3. Zbierz grupy zajęte na podstawie obu kolekcji.
// Chroni to również przed niespójnością starszych danych.
const alreadyTakenGroups=new Set();

for(const group of Object.keys(groups).map(Number)){
if(lockSnapshots[group].exists){
alreadyTakenGroups.add(group);
}
}

for(const user of users){
const snapshot=drawSnapshots[user];

if(snapshot.exists){
const data=snapshot.data();
const group=Number(data.group);

if(Number.isInteger(group)&&groups[group]){
alreadyTakenGroups.add(group);
}
}
}

// 4. Nie można wybrać już wykorzystanej grupy.
if(alreadyTakenGroups.has(selectedGroup)){
throw new Error("GROUP_TAKEN");
}

// 5. Ustal pozostałe osoby i dostępne grupy.
// Wybrana osoba i grupa są traktowane jako przypisane
// na potrzeby symulacji, ale jeszcze nie są zapisywane.
const alreadyDrawnUsers=users.filter(user=>
drawSnapshots[user].exists
);

const remainingUsers=users.filter(user=>
user!==selectedName&&!alreadyDrawnUsers.includes(user)
);

const remainingGroups=Object.keys(groups)
.map(Number)
.filter(group=>
group!==selectedGroup&&!alreadyTakenGroups.has(group)
);

// 6. Odrzuć wybór, jeśli po jego zaakceptowaniu choć jedna
// osoba mogłaby zostać bez prawidłowej grupy.
if(!canCompleteAssignment(remainingUsers,remainingGroups)){
throw new Error("NO_VALID_COMPLETION");
}

// 7. Dopiero po wszystkich sprawdzeniach zapisujemy wynik
// oraz blokadę w tej samej transakcji.
const drawRef=drawRefs[selectedName];
const groupLockRef=lockRefs[selectedGroup];
const selectedMembers=groups[selectedGroup];

transaction.set(drawRef,{
year:CURRENT_YEAR,
user:selectedName,
group:selectedGroup,
winnerMembers:selectedMembers,
timestamp:firebase.firestore.FieldValue.serverTimestamp()
});

transaction.set(groupLockRef,{
year:CURRENT_YEAR,
group:selectedGroup,
timestamp:firebase.firestore.FieldValue.serverTimestamp()
});
});

const winnerMembers=groups[selectedGroup];

resultDiv.innerHTML=
'<span class="success">🎉 Losowanie zakończone!</span>'+
'<div class="winner">Twoja grupa: '+
groupLetter(selectedGroup)+'</div><br>'+
'👥 Wylosowana grupa:<br><br><strong>'+
escapeHtml(winnerMembers.join(", "))+"</strong>";

qrCodeDiv.innerHTML="";

new QRCode(qrCodeDiv,{
text:window.location.href,
width:150,
height:150
});

await updateEverything();

}catch(error){
console.error("Błąd losowania:",error);

if(error.message==="ALREADY_DRAWN"){
resultDiv.innerHTML='<span class="warning">To imię ma już wykonane losowanie.</span>';
}else if(error.message==="GROUP_TAKEN"){
resultDiv.innerHTML='<span class="warning">Ta grupa jest już wykorzystana. Wybierz inną.</span>';
await updateGroupButtons();
}else if(error.message==="OWN_GROUP"){
resultDiv.innerHTML='<span class="warning">Nie możesz wylosować własnej grupy. Wybierz inną.</span>';
}else if(error.message==="NO_VALID_COMPLETION"){
resultDiv.innerHTML=
'<span class="warning">Nie można wybrać tej grupy, ponieważ pozostałe osoby mogłyby zostać bez prawidłowej opcji. Wybierz inną grupę.</span>';
}else{
resultDiv.innerHTML='<span class="warning">Wystąpił problem. Spróbuj ponownie.</span>';
}
}
});
});

function setupRealtimeUpdates(){
db.collection("drawsKK")
.where("year","==",CURRENT_YEAR)
.onSnapshot(()=>{
updateAvailableUsers();
updateGroupButtons();
},error=>{
console.error("Błąd nasłuchiwania draws:",error);
});

db.collection("groupLocksKK")
.where("year","==",CURRENT_YEAR)
.onSnapshot(()=>{
updateGroupButtons();
},error=>{
console.error("Błąd nasłuchiwania grup:",error);
});
}

document.getElementById("title").addEventListener("dblclick",function(){
adminPanel.style.display="block";
adminLogin.style.display=isAdmin()?"none":"block";
adminControls.style.display=isAdmin()?"block":"none";
});

document.getElementById("adminLoginButton").addEventListener("click",async function(){
const email=adminEmail.value.trim();
const password=adminPassword.value;

if(!email||!password){
adminLoginResult.innerHTML='<span class="warning">Wpisz e-mail i hasło.</span>';
return;
}

adminLoginResult.textContent="⏳ Logowanie...";

try{
await auth.signInWithEmailAndPassword(email,password);

if(!isAdmin()){
await auth.signOut();
throw new Error("NOT_ADMIN");
}

adminLogin.style.display="none";
adminControls.style.display="block";
adminLoginResult.innerHTML="";
adminEmail.value="";
adminPassword.value="";

}catch(error){
console.error(error);

if(error.message==="NOT_ADMIN"){
adminLoginResult.innerHTML='<span class="warning">To konto nie ma uprawnień administratora.</span>';
}else{
adminLoginResult.innerHTML='<span class="warning">Nieprawidłowy e-mail lub hasło.</span>';
}
}
});

document.getElementById("loadLogs").addEventListener("click",async function(){
if(!isAdmin()){
alert("Brak uprawnień administratora.");
return;
}

adminLogs.textContent="⏳ Ładowanie wyników...";

try{
const snapshot=await db.collection("drawsKK")
.where("year","==",CURRENT_YEAR).get();

adminLogs.innerHTML="";

if(snapshot.empty){
adminLogs.innerHTML="<p>Brak wykonanych losowań.</p>";
return;
}

const results=snapshot.docs.map(doc=>doc.data())
.sort((a,b)=>String(a.user).localeCompare(String(b.user),"pl"));

results.forEach(data=>{
const groupNumber=Number(data.group);
const letter=groupLetter(groupNumber);
const members=groups[groupNumber]||[];

const div=document.createElement("div");
div.className="log";

div.innerHTML="👤 <strong>"+escapeHtml(data.user)+
"</strong><br>🎯 Wybrana grupa: <strong>"+letter+
"</strong><br>👥 Osoby w grupie: "+
escapeHtml(members.join(", "));

adminLogs.appendChild(div);
});

}catch(error){
console.error(error);
adminLogs.textContent="⚠️ Nie udało się pobrać wyników.";
}
});

document.getElementById("resetData").addEventListener("click",async function(){
if(!isAdmin()){
alert("Brak uprawnień administratora.");
return;
}

const confirmation=prompt(
"Aby zresetować losowanie K&K 2026, wpisz: RESET"
);

if(confirmation!=="RESET")return;

try{
const [drawsSnapshot,groupsSnapshot]=await Promise.all([
db.collection("drawsKK")
.where("year","==",CURRENT_YEAR).get(),
db.collection("groupLocksKK")
.where("year","==",CURRENT_YEAR).get()
]);

const batch=db.batch();

drawsSnapshot.docs.forEach(doc=>batch.delete(doc.ref));
groupsSnapshot.docs.forEach(doc=>batch.delete(doc.ref));

await batch.commit();

alert("Losowanie K&K 2026 zostało zresetowane.");

adminLogs.innerHTML="";
resultDiv.innerHTML="";
qrCodeDiv.innerHTML="";

await updateEverything();

}catch(error){
console.error(error);
alert("Wystąpił błąd podczas resetowania.");
}
});

document.getElementById("adminLogout").addEventListener("click",async function(){
try{
await auth.signOut();

adminControls.style.display="none";
adminLogin.style.display="block";
adminLogs.innerHTML="";
adminLoginResult.innerHTML="";

alert("Administrator został wylogowany.");

await auth.signInAnonymously();
}catch(error){
console.error(error);
}
});

async function startApplication(){
try{
if(!auth.currentUser){
await auth.signInAnonymously();
}

await updateEverything();
setupRealtimeUpdates();

}catch(error){
console.error("Błąd uruchamiania aplikacji:",error);
availableDiv.textContent="⚠️ Nie udało się połączyć z aplikacją.";
}
}

startApplication();
</script>
</body>
</html>
